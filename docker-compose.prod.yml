services:
  mysql:
    image: mysql:8.0
    container_name: karibu-tech-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: karibu_tech
      MYSQL_USER: karibu
      MYSQL_PASSWORD: fnQ2boRFlGOytJ7rC8AKYgdv
      MYSQL_ROOT_PASSWORD: jPXhQOCY3sw8zLoE6MT1v5pV
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - karibu-tech

  redis:
    image: redis:7-alpine
    container_name: karibu-tech-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - redis-data:/data
    networks:
      - karibu-tech

volumes:
  mysql-data:
  redis-data:

networks:
  karibu-tech:
    driver: bridge
